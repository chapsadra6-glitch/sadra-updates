name: Publish SADRA Internet Update

on:
  push:
    branches:
      - main
    paths:
      - .update-request.json

permissions:
  contents: write

concurrency:
  group: sadra-public-internet-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install APK verification tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download and verify candidate
        run: |
          set -euo pipefail
          ARTIFACT_URL="$(jq -er '.artifact_zip_url' .update-request.json)"
          test -n "$ARTIFACT_URL"
          case "$ARTIFACT_URL" in https://*) ;; *) echo "::error::Candidate artifact URL must use HTTPS."; exit 1 ;; esac

          mkdir -p "$RUNNER_TEMP/sadra-candidate"
          curl --fail --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 240 \
            "$ARTIFACT_URL" -o "$RUNNER_TEMP/sadra-candidate.zip"
          unzip -q "$RUNNER_TEMP/sadra-candidate.zip" -d "$RUNNER_TEMP/sadra-candidate"

          APK="$(find "$RUNNER_TEMP/sadra-candidate" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/candidate-cert.txt"
          "$APKSIGNER" verify --print-certs SADRA.apk > "$RUNNER_TEMP/current-cert.txt"

          OLD_CERT="$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($2)}' "$RUNNER_TEMP/current-cert.txt" | sort | tr '\n' ' ')"
          NEW_CERT="$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($2)}' "$RUNNER_TEMP/candidate-cert.txt" | sort | tr '\n' ' ')"
          test -n "$OLD_CERT"
          test -n "$NEW_CERT"
          if [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "::error::Candidate signing certificate differs from the currently published SADRA certificate."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test "$PACKAGE_NAME" = "com.sadra.attendance"
          test "$VERSION_CODE" = "24"
          test "$VERSION_NAME" = "1.20.2"

          CURRENT_BADGING="$("$AAPT" dump badging SADRA.apk | head -n 1)"
          CURRENT_CODE="$(printf '%s\n' "$CURRENT_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          if [ "$VERSION_CODE" -le "$CURRENT_CODE" ]; then
            echo "::error::Candidate version code is not newer than the published build."
            exit 1
          fi

          echo "Candidate package: $PACKAGE_NAME"
          echo "Candidate version: $VERSION_NAME ($VERSION_CODE)"
          echo "Signing certificate matches the published SADRA build."

      - name: Publish APK and update manifest
        run: |
          set -euo pipefail
          APK="$(find "$RUNNER_TEMP/sadra-candidate" -type f -name '*.apk' -print -quit)"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          install -m 0644 "$APK" SADRA.apk
          install -m 0644 "$APK" SADRA-latest.apk

          jq -n \
            --argjson versionCode 24 \
            --arg versionName "1.20.2" \
            --arg apkUrl "https://raw.githubusercontent.com/chapsadra6-glitch/sadra-updates/main/SADRA.apk" \
            --arg sha256 "$SHA256" \
            --arg notes "اصلاح حقوق جمعه‌ها بر اساس روزهای سپری‌شده، ثبت تاریخ پایان همکاری، بازطراحی فیش و حضور و غیاب، و بهبود ارسال پیامک." \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,notes:$notes}' \
            > update.json

          rm -f .update-request.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SADRA.apk SADRA-latest.apk update.json .update-request.json
          git commit -m "Publish SADRA 1.20.2 internet update"
          git push origin HEAD:main
